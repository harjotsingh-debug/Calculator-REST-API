spring.application.name=calculator-api
server.port=${SERVER_PORT:8080}

# Print 10 instead of 1E+1 for normalized BigDecimal results
spring.jackson.generator.write-bigdecimal-as-plain=true

# Actuator: expose health (used by Docker / Compose health checks) and info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Shown at /actuator/info
management.info.env.enabled=true
info.app.name=calculator-api
info.app.description=Calculator REST API (CSE 816 SPE mini-project)
info.app.version=@project.version@
