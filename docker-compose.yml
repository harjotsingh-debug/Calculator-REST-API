# Full stack: 2 calculator replicas behind an Nginx reverse proxy.
#   docker compose up -d --build      -> http://localhost:8090/api/v1/add?a=2&b=3
# Jenkins sets IMAGE_NAME / IMAGE_TAG so the exact image it built and pushed is deployed.

name: calculator

services:
  calculator:
    image: ${IMAGE_NAME:-calculator-api}:${IMAGE_TAG:-latest}
    build: .
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      JAVA_TOOL_OPTIONS: "-Xms128m"
    expose:
      - "8080"
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - calculator-net

  proxy:
    # Config is baked into a small image (nginx/Dockerfile) rather than bind-mounted,
    # so deployment also works when Compose is driven from inside the Jenkins container.
    image: calculator-proxy:latest
    build: ./nginx
    ports:
      - "${PROXY_PORT:-8090}:80"
    depends_on:
      calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - calculator-net

networks:
  calculator-net:
    driver: bridge
