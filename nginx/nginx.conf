# Reverse proxy in front of the calculator replicas.
# Docker's embedded DNS (127.0.0.11) returns every replica's IP for "calculator";
# re-resolving every 10s means a re-deploy with new container IPs is picked up automatically.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Using a variable forces nginx to resolve at request time instead of only at startup
    set $calculator_upstream http://calculator:8080;

    location / {
        proxy_pass $calculator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        # Try another replica if one is down mid-deploy
        proxy_next_upstream error timeout http_502 http_503;
    }
}
